<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Magazine Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="viewer" aria-label="Luxury magazine flipbook viewer">
      <button class="nav nav-left" id="prevBtn" aria-label="Previous spread"></button>
      <section id="spreadFrame" class="spread-frame" aria-live="polite"></section>
      <button class="nav nav-right" id="nextBtn" aria-label="Next spread"></button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
